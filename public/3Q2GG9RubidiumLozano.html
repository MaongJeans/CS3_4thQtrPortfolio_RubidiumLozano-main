<!DOCTYPE html>
<html>
<head>
<title>My Movie List</title>

<style>
body{
    font-family: "Poppins", sans-serif;
    background-image: url("movieIcon.avif");
    background-size: cover;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container{
    width: 350px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
}

.box{
    background: rgb(255, 255, 255);
    width: 300px;
    margin: auto;
    padding: 15px;
    border: 3px solid rgb(0, 0, 0);
}

input, select, textarea{
    width: 100%;
    padding: 5px;
    margin-top: 5px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #000000;
}

button{
    background: #e63946;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
}

button:hover{
    background: #c92f3c;
}

.star{
    font-size: 22px;
    cursor: pointer;
    color: rgb(96, 96, 96);
    transition: color 0.2s;
}

.star.gold{
    color: gold;
}

.movie{
    border: 2px solid gray;
    margin-top: 10px;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.delete-btn{
    background: #e63946;
    color: white;
    border: none;
    padding: 2px 8px;
    border-radius: 5px;
    cursor: pointer;
}

.delete-btn:hover{
    background: #c92f3c;
}

.movie-info{
    display: flex;
    flex-direction: column;
}
</style>
</head>

<body>

<div class="box">

<h2>Movie List</h2>

Title:<br>
<input id="title">

Year:<br>
<input id="year">

Genre:<br>
<select id="genre">
<option>Action</option>
<option>Comedy</option>
<option>Drama</option>
<option>Horror</option>
</select>

Rating:<br>
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>

<br><br>
<button onclick="addMovie()">Add Movie</button>

<h3>Movies</h3>
<div id="list"></div>

</div>

<script>
let rating = 0;
const stars = document.querySelectorAll(".star");

// function to update star colors for input
function updateStars(num){
    stars.forEach((star, i) => {
        if(i < num) star.classList.add("gold");
        else star.classList.remove("gold");
    });
}

// hover effect for input stars
stars.forEach((star, index) => {
    star.addEventListener("mouseover", () => {
        updateStars(index + 1);
    });
    star.addEventListener("mouseout", () => {
        updateStars(rating);
    });
    star.addEventListener("click", () => {
        rating = index + 1;
        updateStars(rating);
    });
});

function addMovie(){

    const title = document.getElementById("title").value.trim();
    const year = document.getElementById("year").value.trim();
    const genre = document.getElementById("genre").value;

    if(title === "" || year === "" || rating === 0){

        alert("Please fill out all the necessary information!");
        return;

    }

    let movies = JSON.parse(localStorage.getItem("movies"));

    if(!movies){
        movies = [];
    }

    let existing = movies.find(function(m){
        return m.title.toLowerCase() === title.toLowerCase() && m.year === year;
    });

    if(existing){

        if(existing.ratings){
            existing.ratings.push(rating);
        } else {
            existing.ratings = [existing.rating, rating];
            delete existing.rating;
        }

    } else {

        movies.push({
            title: title,
            year: year,
            genre: genre,
            ratings: [rating],
            notes: ""
        });

    }

    localStorage.setItem("movies", JSON.stringify(movies));

    document.getElementById("title").value = "";
    document.getElementById("year").value = "";

    rating = 0;
    updateStars(0);

    showMovies();
}

function deleteMovie(index) {
    // ts asks for confirm
    const confirmDelete = confirm("Are you sure you want to delete this movie?");

    if (confirmDelete) {
        let movies = JSON.parse(localStorage.getItem("movies"));

        movies.splice(index, 1);

        localStorage.setItem("movies", JSON.stringify(movies));

        showMovies();

        
        alert("Movie has been deleted successfully!");
    } else {
       
        alert("Deletion of the movie, cancelled!");
    }
}

function showMovies(){

    const list = document.getElementById("list");
    list.innerHTML = "";

    const movies = JSON.parse(localStorage.getItem("movies"));

    if(!movies){
        return;
    }

    for(let i = 0; i < movies.length; i++){

        const movie = movies[i];

        const div = document.createElement("div");
        div.className = "movie";

        const movieInfo = document.createElement("div");
        movieInfo.className = "movie-info";

        const infoText = document.createElement("div");
        infoText.textContent = movie.title + " (" + movie.year + ") - " + movie.genre;
        movieInfo.appendChild(infoText);

        let ratingsArray;

        if(movie.ratings){
            ratingsArray = movie.ratings;
        } else {
            ratingsArray = [movie.rating];
        }

        let total = 0;

        for(let r = 0; r < ratingsArray.length; r++){
            total += ratingsArray[r];
        }

        let avg = Math.round(total / ratingsArray.length);

        const starDiv = document.createElement("div");

        for(let s = 0; s < 5; s++){

            const star = document.createElement("span");
            star.textContent = "★";
            star.className = "star";

            if(s < avg){
                star.classList.add("gold");
            }

            starDiv.appendChild(star);

        }

        movieInfo.appendChild(starDiv);

        const noteInput = document.createElement("textarea");
        noteInput.placeholder = "Add notes...";

        if(movie.notes){
            noteInput.value = movie.notes;
        } else {
            noteInput.value = "";
        }

        noteInput.addEventListener("change", function(){

            let movies = JSON.parse(localStorage.getItem("movies"));

            movies[i].notes = noteInput.value;

            localStorage.setItem("movies", JSON.stringify(movies));

        });

        movieInfo.appendChild(noteInput);

        // ✅ delete button added back
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete-btn";

        delBtn.onclick = function(){
            deleteMovie(i);
        };

        div.appendChild(movieInfo);
        div.appendChild(delBtn);

        list.appendChild(div);

    }
}

showMovies();
</script>

</body>
</html>
